- name: Harden sshd
  hosts: web:&auto
  gather_facts: false
  tasks:
    - name: sshd_config, checked before it replaces the live file
      ansible.builtin.template:
        src: sshd_config.j2
        dest: /etc/ssh/sshd_config
        owner: root
        mode: "0600"
        validate: "sshd -t -f %s"
      notify: Reload sshd

  handlers:
    - name: Reload sshd
      ansible.builtin.command: sh -c 'kill -HUP $(cat /run/sshd.pid)'
