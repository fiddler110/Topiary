- name: Firewall secret
  hosts: fw:&auto
  gather_facts: false
  vars_files:
    - secrets.yml
  tasks:
    - name: Firewall credential file
      ansible.builtin.copy:
        content: "admin_password={{ fw_admin_password }}\n"
        dest: /etc/fw-admin.conf
        owner: root
        group: root
        mode: "0600"
      no_log: true
