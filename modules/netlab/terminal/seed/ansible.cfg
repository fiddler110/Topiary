[defaults]
inventory = hosts.ini
host_key_checking = False
log_path = ./ansible.log
timeout = 10
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=30s -o UserKnownHostsFile=/dev/null
