# Put the firewalls and web servers back to the starting point (closed, default nginx page).
#   ansible-playbook reset_fw.yml                 both branches
#   ansible-playbook reset_fw.yml -e branch=a     the automated branch only
# Management SSH is never touched, so a bad rule cannot lock Ansible out.
- name: Reset the firewalls
  hosts: fw
  gather_facts: false
  tasks:
    - name: Back to the baseline rules
      when: branch is not defined or branch == inventory_hostname.split('-')[1]
      ansible.builtin.shell: |
        iptables -F LAB
        iptables -F FORWARD
        iptables -P FORWARD DROP
        iptables -A FORWARD -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
        iptables -A FORWARD -j LAB
        iptables -A FORWARD -p icmp --icmp-type echo-request -j ACCEPT
      changed_when: true

- name: Reset the web servers
  hosts: web
  gather_facts: false
  tasks:
    - name: Back to the default site
      when: branch is not defined or branch == inventory_hostname.split('-')[1]
      ansible.builtin.shell: |
        find /etc/nginx/http.d -type f ! -name default.conf -delete
        printf 'server {\n  listen 80 default_server;\n  root /var/www/html;\n}\n' > /etc/nginx/http.d/default.conf
        printf '<!doctype html><title>%s</title><h1>%s</h1><p>nginx default page.</p>\n' {{ inventory_hostname }} {{ inventory_hostname }} > /var/www/html/index.html
        rm -rf /etc/nginx/tls /etc/nginx/admin.inc /etc/nginx/.htpasswd /var/www/html/admin
        printf 'Port 22\nPermitRootLogin yes\nPasswordAuthentication yes\nPrintMotd no\nSubsystem sftp internal-sftp\n' > /etc/ssh/sshd_config
        kill -HUP $(cat /run/sshd.pid)
        nginx -s reload
      changed_when: true
